# CI：格式检查 + 代码生成一致性 + 静态检查 + 全量测试。
# Flutter / Java 版本统一由 mise.toml 锁定，与本地工具链一致。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  # 同一分支 / PR 的旧运行自动取消，节省 CI 时长。
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: 安装依赖（严格按 lockfile）
        run: mise exec -- flutter pub get --enforce-lockfile

      - name: 手写 Dart 格式检查（不写文件）
        shell: bash
        run: |
          find lib test -type f -name '*.dart' ! -name '*.g.dart' ! -name '*.freezed.dart' -print0 |
            xargs -0 mise exec -- dart format --output=none --set-exit-if-changed

      # 生成文件已入库：重新生成后工作树应保持干净，
      # 同时拦截已跟踪文件漂移和漏提交的新生成文件。
      - name: 代码生成一致性检查
        shell: bash
        run: |
          mise exec -- dart run build_runner build
          mise exec -- flutter gen-l10n
          git status --porcelain
          test -z "$(git status --porcelain)"

      # 必须用 dart analyze：flutter analyze 不会加载 riverpod_lint 插件。
      # --fatal-infos：info 级也视为失败，与「0 issues」标准一致。
      - name: 静态检查（0 issues）
        run: mise exec -- dart analyze --fatal-infos

      - name: 全量测试
        run: mise exec -- flutter test
